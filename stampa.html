<title>Figuprint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: barra laterale comandi + area fogli A4; su telefono una colonna. Identità nero/oro Unicum */
:root{
  --bg:#f3f0e8; --surface:#ffffff; --fg:#16140f; --muted:#6a6352; --line:#ddd5c2;
  --accent:#a8801f; --accent-fg:#ffffff; --accent-soft:#f1e6c8; --desk:#4a463d;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0e0b; --surface:#1a1813; --fg:#eeeae0; --muted:#a69e8a; --line:#322e24;
  --accent:#d9b25a; --accent-fg:#16120a; --accent-soft:#2f2816; --desk:#24221c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0e0b; --surface:#1a1813; --fg:#eeeae0; --muted:#a69e8a; --line:#322e24;
  --accent:#d9b25a; --accent-fg:#16120a; --accent-soft:#2f2816; --desk:#24221c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.app{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start}
@media (max-width:820px){.app{grid-template-columns:1fr}}
aside{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
@media (max-width:820px){aside{position:static}}
.brandwrap{display:flex;align-items:center;gap:10px}
.brandwrap img{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:cover}
.brand{font-family:var(--f-display);font-weight:900;font-size:2rem;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand span{color:var(--accent)}
.sub{font-family:var(--f-label);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:1.5rem;line-height:1.05;margin:0;text-wrap:balance}
.panel p{margin:0;color:var(--muted);font-size:.95rem}
label{display:flex;flex-direction:column;gap:4px;font-family:var(--f-label);font-weight:600;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=text]{font:500 1rem var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
button.b{appearance:none;border:0;border-radius:999px;padding:12px 18px;font:700 .95rem var(--f-label);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.b:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-fg)}
.secondary{background:var(--accent-soft);color:var(--fg)}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)!important}
main{display:flex;flex-direction:column;gap:16px;min-width:0}
.mainhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.stats{font-family:var(--f-label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.sheet{display:flex;flex-direction:column;gap:10px}
.sheet img{width:100%;aspect-ratio:210/297;max-width:100%;background:#fff;border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:zoom-in}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .row .b{flex:1;padding-inline:10px;font-size:.85rem}
.empty{border:2px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--f-display);font-size:1.6rem;text-transform:uppercase;color:var(--fg)}
.note{font-size:.88rem;color:var(--muted);margin:0}
.status{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font:700 1.1rem var(--f-label);letter-spacing:.1em;text-transform:uppercase;z-index:50}

/* ---------- Anteprima di stampa ---------- */
.pv{position:fixed;inset:0;z-index:40;background:var(--desk);display:flex;flex-direction:column}
.pvbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pvbar .title{font-family:var(--f-display);font-weight:700;font-size:1.3rem;text-transform:uppercase;margin-right:auto}
.pvbar .info{font-family:var(--f-label);font-weight:600;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums}
.pvbody{flex:1;overflow:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:24px}
.paper{background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.45);aspect-ratio:210/297;max-width:100%;flex:none;position:relative}
.paper img{width:100%;height:100%;display:block}
.paper .pn{position:absolute;left:0;right:0;bottom:-22px;text-align:center;font:600 .8rem var(--f-label);letter-spacing:.1em;color:#ddd}
.pvnote{color:#eee;font-size:.88rem;max-width:62ch;text-align:center;margin:0}

/* ---------- Stampa vera (solo fuori dal visualizzatore Claude) ---------- */
#printArea{display:none}
@page{size:A4 portrait;margin:0}
@media print{
  :root{padding:0!important}
  body{padding:0!important;background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea img{display:block;width:210mm;height:297mm;page-break-after:always;break-after:page}
  #printArea img:last-child{page-break-after:auto;break-after:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <aside>
    <div class="brandwrap"><img id="hdrLogo" alt="Logo Unicum">
      <div><div class="brand">Figu<span>print</span></div><div class="sub">v1.7 · fogli A4 per figurine</div></div></div>
    <div class="panel">
      <h2>Gestione foto</h2>
      <p>Carica le figurine: vengono ritagliate in formato 54 × 76 mm e impaginate 9 per foglio, con i crocini di taglio.</p>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <button class="b primary" id="loadBtn">Carica immagini</button>
      <label>Titolo del foglio<input type="text" id="sheetTitle" value="Unicum Kickboxing · Figurine" maxlength="60"></label>
    </div>
    <div class="panel">
      <h2>Azioni</h2>
      <button class="b secondary" id="previewBtn" disabled>Anteprima di stampa</button>
      <button class="b secondary" id="pdfBtn" disabled>Scarica PDF</button>
      <button class="b ghost" id="clearBtn" disabled>Svuota tutto</button>
      <p class="note" id="actNote">Svuota l'area di lavoro per iniziare una nuova composizione.</p>
    </div>
  </aside>

  <main>
    <div class="mainhead"><h2>Fogli A4 generati</h2><span class="stats" id="stats">0 figurine caricate</span></div>
    <div id="sheets" class="sheets"></div>
  </main>
</div>

<div class="pv" id="pv" hidden role="dialog" aria-modal="true" aria-label="Anteprima di stampa">
  <div class="pvbar">
    <span class="title">Anteprima di stampa</span>
    <span class="info" id="pvInfo"></span>
    <button class="b secondary" id="pvFit">Pagina intera</button>
    <button class="b primary" id="pvPrint">Stampa</button>
    <button class="b secondary" id="pvPdf">Scarica PDF</button>
    <button class="b ghost" id="pvClose">Chiudi</button>
  </div>
  <div class="pvbody" id="pvBody"></div>
</div>

<div id="printArea"></div>
<div class="status" id="status" hidden></div>

const $=id=>document.getElementById(id);
$('hdrLogo').src=LOGO_SRC;
const logo=new Image();logo.src=LOGO_SRC;

// A4 a 300 dpi; figurina 638×898 px ≈ 54×76 mm
const A4W=2480,A4H=3508,CW=638,CH=898,COLS=3,GX=120,GY=140,PER=9;
let figures=[],sheets=[];
const inClaude=!!(window.claude&&window.claude.use);
let dl=null;if(inClaude)window.claude.use("downloads").then(x=>dl=x).catch(()=>{});

function status(t){const s=$('status');if(t){s.textContent=t;s.hidden=false}else s.hidden=true}
function stats(){const n=figures.length,p=Math.ceil(n/PER);
  $('stats').textContent=`${n} figurin${n===1?'a':'e'} caricat${n===1?'a':'e'} · ${p} fogl${p===1?'io':'i'}`;
  ['previewBtn','pdfBtn','clearBtn'].forEach(id=>$(id).disabled=!n);}

function crop(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');c.width=CW;c.height=CH;const x=c.getContext('2d');
      const r=img.naturalWidth/img.naturalHeight,t=CW/CH;let sw=img.naturalWidth,sh=img.naturalHeight,sx=0,sy=0;
      if(r>t){sw=sh*t;sx=(img.naturalWidth-sw)/2}else{sh=sw/t;sy=(img.naturalHeight-sh)/2}
      x.drawImage(img,sx,sy,sw,sh,0,0,CW,CH);URL.revokeObjectURL(url);res(c);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(null)};
    img.src=url;
  });
}

function marks(c,x,y,w,h){
  const L=45,O=20;c.strokeStyle='rgba(0,0,0,.5)';c.lineWidth=3;c.beginPath();
  [[x,y,-1,-1],[x+w,y,1,-1],[x,y+h,-1,1],[x+w,y+h,1,1]].forEach(([px,py,dx,dy])=>{
    c.moveTo(px+dx*O,py+dy*O);c.lineTo(px+dx*(O+L),py+dy*O);
    c.moveTo(px+dx*O,py+dy*O);c.lineTo(px+dx*O,py+dy*(O+L));
  });c.stroke();
}

function sheet(chunk,n,tot){
  const cv=document.createElement('canvas');cv.width=A4W;cv.height=A4H;const c=cv.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,A4W,A4H);
  // intestazione con logo
  if(logo.complete&&logo.naturalWidth){c.save();c.beginPath();c.arc(185,160,60,0,Math.PI*2);c.clip();c.drawImage(logo,125,100,120,120);c.restore()}
  c.fillStyle='#111';c.font='900 64px "Big Shoulders Display", Impact, sans-serif';c.textBaseline='alphabetic';
  c.fillText(($('sheetTitle').value||'Figurine').toUpperCase(),270,182);
  c.fillStyle='#666';c.font='600 40px "Barlow Condensed", sans-serif';c.textAlign='right';
  c.fillText(`${new Date().toLocaleDateString('it-IT')} · Pagina ${n} di ${tot}`,2340,182);c.textAlign='left';
  const g=c.createLinearGradient(140,0,2340,0);["#7a5a12","#c9a043","#f3d98a","#b48a2c"].forEach((k,i)=>g.addColorStop(i/3,k));
  c.fillStyle=g;c.fillRect(140,232,2200,8);
  const sx=(A4W-(COLS*CW+(COLS-1)*GX))/2,sy=360;
  for(let i=0;i<PER;i++){
    const x=sx+(i%COLS)*(CW+GX),y=sy+Math.floor(i/COLS)*(CH+GY);
    if(i<chunk.length){c.drawImage(chunk[i],x,y,CW,CH);c.strokeStyle='rgba(0,0,0,.1)';c.lineWidth=2;c.strokeRect(x,y,CW,CH)}
    else{c.fillStyle='#f4f1ea';c.fillRect(x,y,CW,CH);c.strokeStyle='#dcd5cc';c.lineWidth=3;c.strokeRect(x,y,CW,CH);
      c.fillStyle='rgba(0,0,0,.3)';c.font='700 40px "Barlow Condensed", sans-serif';c.textAlign='center';c.fillText('SLOT VUOTO',x+CW/2,y+CH/2);c.textAlign='left'}
    marks(c,x,y,CW,CH);
  }
  return cv.toDataURL('image/jpeg',0.92);
}

async function renderAll(){
  const box=$('sheets');sheets=[];
  if(!figures.length){box.innerHTML='<div class="empty"><strong>Nessuna immagine caricata</strong>Tocca “Carica immagini” per iniziare. Ogni foglio contiene 9 figurine.</div>';stats();buildPrintArea();return}
  const tot=Math.ceil(figures.length/PER);box.innerHTML='';
  for(let i=0;i<figures.length;i+=PER){
    const n=i/PER+1;status(`Generazione pagina ${n} di ${tot}…`);
    await new Promise(r=>setTimeout(r,10));
    const url=sheet(figures.slice(i,i+PER),n,tot);sheets.push(url);
    const d=document.createElement('div');d.className='sheet';
    const im=new Image();im.src=url;im.alt=`Foglio ${n} di ${tot}`;im.onclick=()=>openPreview(n-1);d.append(im);
    const row=document.createElement('div');row.className='row';
    const b1=document.createElement('button');b1.className='b secondary';b1.textContent=`Condividi / salva pag. ${n}`;b1.onclick=()=>sharePage(n-1);
    const b2=document.createElement('button');b2.className='b ghost';b2.textContent='Anteprima';b2.onclick=()=>openPreview(n-1);
    row.append(b1,b2);d.append(row);box.append(d);
  }
  status();stats();buildPrintArea();
}

function buildPrintArea(){const p=$('printArea');p.innerHTML='';sheets.forEach(u=>{const i=new Image();i.src=u;p.append(i)})}

async function blobOf(u){return (await fetch(u)).blob()}
async function saveBlob(blob,name){
  if(dl){try{await dl.save({filename:name,data:blob});note('File salvato.');return}catch(e){if(e&&e.code==='declined')return}}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function note(t){$('actNote').textContent=t}
async function sharePage(i){
  const name=`Unicum_Figurine_Pagina_${i+1}.jpg`,blob=await blobOf(sheets[i]);
  try{const f=new File([blob],name,{type:'image/jpeg'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:`Foglio figurine - pagina ${i+1}`});return}}
  catch(e){if(e.name==='AbortError')return}
  saveBlob(blob,name);
}
async function makePdf(){
  if(!sheets.length)return;
  if(!window.jspdf){note('Generatore PDF non caricato: controlla la connessione e ricarica la pagina.');return}
  status('Creazione PDF…');await new Promise(r=>setTimeout(r,10));
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  sheets.forEach((u,i)=>{if(i)pdf.addPage();pdf.addImage(u,'JPEG',0,0,210,297)});
  const blob=pdf.output('blob');status();
  await saveBlob(blob,`Unicum_Figurine_${new Date().toISOString().slice(0,10)}.pdf`);
}

/* ---------- anteprima di stampa ---------- */
let fitPage=true;
function sizePapers(){
  const body=$('pvBody'),w=body.clientWidth-40,h=body.clientHeight-70;
  const pw=fitPage?Math.min(w,h*210/297):Math.min(w,900);
  body.querySelectorAll('.paper').forEach(p=>p.style.width=pw+'px');
  $('pvFit').textContent=fitPage?'Ingrandisci':'Pagina intera';
}
function openPreview(start=0){
  if(!sheets.length)return;
  const body=$('pvBody');body.innerHTML='';
  sheets.forEach((u,i)=>{const p=document.createElement('div');p.className='paper';p.id='pg'+i;
    const im=new Image();im.src=u;im.alt=`Pagina ${i+1}`;p.append(im);
    const pn=document.createElement('div');pn.className='pn';pn.textContent=`Pagina ${i+1} di ${sheets.length}`;p.append(pn);body.append(p)});
  const n=document.createElement('p');n.className='pvnote';
  n.textContent=inClaude?'Qui la stampa diretta non è disponibile: scarica il PDF e stampalo in formato A4, scala 100% (dimensioni effettive), senza adattare alla pagina.'
    :'Stampa in A4 verticale, scala 100% (dimensioni effettive), margini nessuno: le figurine escono a 54 × 76 mm.';
  body.append(n);
  $('pvInfo').textContent=`A4 · ${sheets.length} pagin${sheets.length===1?'a':'e'} · ${figures.length} figurine`;
  $('pvPrint').hidden=inClaude;
  $('pv').hidden=false;document.body.style.overflow='hidden';
  requestAnimationFrame(()=>{sizePapers();const t=$('pg'+start);if(t)t.scrollIntoView({block:'start'})});
  $('pvClose').focus();
}
function closePreview(){$('pv').hidden=true;document.body.style.overflow=''}
$('pvClose').onclick=closePreview;
$('pvFit').onclick=()=>{fitPage=!fitPage;sizePapers()};
$('pvPrint').onclick=()=>window.print();
$('pvPdf').onclick=makePdf;
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('pv').hidden)closePreview()});
addEventListener('resize',()=>{if(!$('pv').hidden)sizePapers()});

/* ---------- comandi ---------- */
$('loadBtn').onclick=()=>{$('fileInput').value='';$('fileInput').click()};
$('fileInput').onchange=async e=>{
  const files=[...(e.target.files||[])];if(!files.length)return;let bad=0;
  for(const [i,f] of files.entries()){status(`Ritaglio foto ${i+1} di ${files.length}…`);const c=await crop(f);if(c)figures.push(c);else bad++}
  await renderAll();if(bad)note(`${bad} file non leggibil${bad===1?'e':'i'}: usa JPG o PNG.`);
};
$('clearBtn').onclick=()=>{figures=[];renderAll();note('Area di lavoro svuotata.')};
$('previewBtn').onclick=()=>openPreview(0);
$('pdfBtn').onclick=makePdf;
$('sheetTitle').addEventListener('change',()=>{if(figures.length)renderAll()});

renderAll();
if(document.fonts)document.fonts.ready.then(()=>{if(figures.length)renderAll()});
</script>
